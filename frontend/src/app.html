<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="/favicon.ico" type="image/ico" />
        <link rel="icon" href="/favicon.png" type="image/png" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/favicon.png" type="image/png" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>TimeTracker | RiseUpGroup</title>

        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://timetracker.riseupgroup.net" />
        <meta property="og:title" content="TimeTracker | a RiseUpGroup project" />
        <meta
            property="og:description"
            content="TimeTracker lets you track the time you did something | TimeTracker is a RiseUpGroup project"
        />
        <!--<meta property="og:site_name" content="ShortURL" />-->

        <meta
            property="og:image:alt"
            content="TimeTracker lets you track the time you did something | TimeTracker is a RiseUpGroup project"
        />
        <meta property="og:image" content="https://timetracker.riseupgroup.net/favicon.png" />
        <!--<meta property="og:image:width" content="200" />-->
        <!--<meta property="og:image:height" content="200" />-->

        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
    <script>
        window.user = null;
        window.refreshUser = () => {
            window.userPromise = new Promise(async (resolve) => {
                let res = await fetch("/auth/user");
                if (res.ok) {
                    window.user = await res.json();
                    resolve(window.user);
                } else {
                    resolve(null);
                }
            });
            return window.userPromise;
        };
        window.getUser = async () => {
            if (window.user) return window.user;
            else {
                if (!window.userPromise) {
                    window.refreshUser();
                }
                return await window.userPromise;
            }
        };
    </script>
    <style>
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #11141f;
            }
        }

        @media (prefers-color-scheme: light) {
            body {
                background-color: #fff;
            }
        }
    </style>
</html>
