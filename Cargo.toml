[package]
name = "timetracker"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/riseupgroup/timetracker"
description = "This tool helps you to keep track of your time worked"
authors = ["Julian Horn <mail@julian-horn.net>", "Bela Drescher <mail@untbu.de>"]
license = "MIT"

[workspace]
members = ["migration"]
exclude = ["svelte-path-finder"]

[dependencies]
svelte-path-finder = { path = "./svelte-path-finder" }
authentication-service = { git = "https://github.com/riseupgroup/authentication-service.git" }
actix-web = "4.11.0"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-files = "0.6.8"
static-files = "0.3.1"
serde = { version = "1.0.228", features = ["derive"] }
sea-orm = { version = "1.1.17", features = ["runtime-async-std-rustls", "sqlx-mysql", "macros"] }
migration = { path = "migration" }
lazy_static = "1.5.0"
dotenv = "0.15.0"
env_logger = "0.11.8"
log = "0.4.28"
serde_json = "1.0.145"
shellexpand = "3.1.1"
chrono = "0.4.42"
paste = "1.0.15"
serde-inline-default = "1.0.0"
serde_qs = { version = "0.15.0", features = ["actix4"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
base64 = "0.22.1"
rand = "0.9.2"
argon2 = "0.5.3"
password-hash = "0.5.0"
parse_duration = "2.1.1"

[build-dependencies]
static-files = "0.3.1"
